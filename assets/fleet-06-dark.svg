<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350" role="img" aria-label="PATHOLAB: Patients, collection agents, sample tracking and reports for a pathology lab, in one platform. Rule: Every screen sits behind role-based access.">
<title>PATHOLAB: Patients, collection agents, sample tracking and reports for a pathology lab, in one platform. Rule: Every screen sits behind role-based access.</title>
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1A232E"/></pattern>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
  .spin-r { transform-box: fill-box; transform-origin: center; animation: spin 22s linear infinite reverse; }
  .breathe { animation: breathe 3.6s ease-in-out infinite; }
  .scan { animation: scan 7s linear infinite; }
  .caret { animation: caret 1.1s steps(1) infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes scan { from { transform: translateX(0); } to { transform: translateX(1120px); } }
  @keyframes caret { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
