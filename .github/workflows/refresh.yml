name: refresh

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/build.py]

permissions:
  contents: write

concurrency:
  group: readme-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw the profile
        run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git config user.name "krushna-sahu1"
          git config user.email "174834492+krushna-sahu1@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "refresh signal" && git push
